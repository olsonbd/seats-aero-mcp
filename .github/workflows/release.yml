name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semver tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate tag and package version
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          node -e '
            const manifest = require("./package.json");
            const lockfile = require("./package-lock.json");
            const expectedTag = `v${manifest.version}`;
            if (process.env.RELEASE_TAG !== expectedTag) {
              throw new Error(`release tag must be ${expectedTag}`);
            }
            if (lockfile.version !== manifest.version || lockfile.packages[""].version !== manifest.version) {
              throw new Error("package-lock.json version does not match the release tag");
            }
          '

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Test the packed artifact
        run: npm run test:package

      - name: Publish with npm Trusted Publishing
        run: npm publish
