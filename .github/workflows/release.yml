name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release and package identity
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a semver release tag such as v0.1.0, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          release_version="${RELEASE_TAG#v}"
          npm version "$release_version" --no-git-tag-version --allow-same-version --ignore-scripts

          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lockfile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expectedName = '@kwonye/seats-aero-mcp';
          const expectedVersion = process.env.RELEASE_TAG.slice(1);

          if (packageJson.name !== expectedName) {
            throw new Error(`Unexpected package name: ${packageJson.name}`);
          }
          if (packageJson.version !== expectedVersion) {
            throw new Error(`package.json version ${packageJson.version} does not match ${expectedVersion}`);
          }
          if (lockfile.name !== expectedName || lockfile.version !== expectedVersion) {
            throw new Error('package-lock.json root metadata does not match the release');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      # npm Trusted Publishing exchanges this job's short-lived GitHub OIDC
      # identity for a publish credential. No NPM_TOKEN secret is required.
      - name: Publish public package with npm Trusted Publishing
        run: npm publish --access public
